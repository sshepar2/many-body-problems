[project]
name = "many-body-problems"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "matplotlib",
    "tqdm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbp"]
